{{- $secretName := include "wallabag.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
data:
  # Symfony's app secret (CSRF tokens, signed URLs, session signing, ...). Generated once on
  # first install and kept stable across upgrades via `lookup`, rather than using the image's
  # publicly-known default value (SYMFONY__ENV__SECRET=ovmpmAWXRCabNlMgzlzFXDYmCFfzGv).
  {{- if $existing }}
  SYMFONY__ENV__SECRET: {{ index $existing.data "SYMFONY__ENV__SECRET" }}
  {{- else }}
  SYMFONY__ENV__SECRET: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
