---
# Complete cluster deployment. The first play builds the overlay, because peers render from
# each other's public keys and those are generated on the hosts themselves — no key has to
# be prepared in inventory, so a clean node needs nothing but its host_vars.

- name: Build the cluster overlay
  hosts: k3s_cluster
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    # Every member must take part in the same run: a peer's public key only exists once that
    # host has generated it. A limited run keeps the mesh it already has.
    - name: Decide whether the overlay can be built in this run
      ansible.builtin.set_fact:
        overlay_phase: >-
          {{ not ansible_check_mode
             and ansible_play_hosts_all | length == groups[amneziawg_group] | length }}
      tags: [always]

    - name: Explain a skipped overlay
      ansible.builtin.debug:
        msg: >-
          Overlay skipped ({{ 'check mode' if ansible_check_mode else
          'only ' ~ (ansible_play_hosts_all | length) ~ ' of ' ~
          (groups[amneziawg_group] | length) ~ ' hosts selected' }}): key exchange needs every
          member of {{ amneziawg_group }} in one real run.
      when: not overlay_phase | bool
      tags: [always]

  roles:
    - role: amneziawg
      when: overlay_phase | bool
      tags: [amneziawg]

- name: Deploy k3s server
  hosts: k3s_server

  roles:
    - role: hostname
      tags: [hostname]
    - role: swap
      tags: [swap]
    - role: nftables
      tags: [nftables]
    - role: k3s_server
      tags: [k3s_server]
    - role: ci_deploy_key
      tags: [ci_deploy_key]
    - role: grafana_alloy
      tags: [grafana_alloy]
      vars:
        grafana_alloy_collect_pod_logs: true
    - role: ssh_hardening
      tags: [ssh_hardening]
    - role: ssh_alert
      tags: [ssh_alert]

- name: Deploy k3s agent
  hosts: k3s_agent

  roles:
    - role: hostname
      tags: [hostname]
    # Manage a worker's swapfile only when requested in inventory. Preserve x13's OS swap.
    - role: swap
      tags: [swap]
      when: swap_enabled | bool
    - role: open_iscsi
      tags: [open_iscsi]
    - role: nftables
      tags: [nftables]
    - role: k3s_agent
      tags: [k3s_agent]
    - role: grafana_alloy
      tags: [grafana_alloy]
      vars:
        grafana_alloy_collect_pod_logs: true
    - role: ssh_hardening
      tags: [ssh_hardening]
    - role: ssh_alert
      tags: [ssh_alert]
