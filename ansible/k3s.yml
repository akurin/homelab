---
- name: Deploy k3s server
  hosts: k3s_server
  vars:
    k3s_pod_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16

  roles:
    - role: hostname
      tags: [hostname]
    - role: swap
      tags: [swap]
    - role: nftables
      vars:
        nftables_trusted_sources:
          # K3s pod IPs — pods on this node communicate with the host (e.g. Traefik → API server)
          - "{{ k3s_pod_cidr }}"
          # K3s service ClusterIPs — virtual IPs DNAT'd by kube-proxy; source remains a pod IP
          # after DNAT but the destination passes through the host INPUT chain
          - "{{ k3s_service_cidr }}"
        nftables_trusted_source_groups:
          # k3s agents — only the API server (6443) and flannel's WireGuard tunnel (51820), not every port
          - group: k3s_agent
            tcp: [6443]
            udp: [51820]
        nftables_allowed_tcp:
          - 22
    - role: k3s_server
    - role: ci_deploy_key
      tags: [ci-deploy-key]
    - role: grafana_alloy
      tags: [grafana-alloy]
      vars:
        grafana_alloy_collect_pod_logs: true
    - role: ssh_hardening

- name: Deploy k3s agent
  hosts: k3s_agent
  vars:
    k3s_pod_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16

  roles:
    - role: hostname
      tags: [hostname]
    # This node runs the entire workload (the server is tainted NoSchedule) on 1 vCPU /
    # 1.7 GiB. Without swap the kernel can only reclaim page cache, and it thrashes hard
    # enough to starve Traefik's liveness probe — see k3s.md's Memory and swap section.
    - role: swap
      tags: [swap]
      vars:
        swap_enabled: true
    - role: open_iscsi
    - role: nftables
      vars:
        nftables_trusted_sources:
          - "{{ k3s_pod_cidr }}"
          - "{{ k3s_service_cidr }}"
        nftables_trusted_source_groups:
          # k3s servers — only kubelet (10250, for kubectl logs/exec against pods here) and
          # flannel's WireGuard tunnel (51820) back to the agent
          - group: k3s_server
            tcp: [10250]
            udp: [51820]
        nftables_allowed_tcp:
          - 22
          - 25
          - 80
          - 443
    - role: k3s_agent
    - role: grafana_alloy
      tags: [grafana-alloy]
      vars:
        grafana_alloy_collect_pod_logs: true
    - role: ssh_hardening
