---
# Xray client for the home node (x13). It keeps the split routing out of the
# Kubernetes manifest:
#   socks_direct  10807 -> direct  (retail stores, Russian sites)
#   socks_proxy   10808 -> VLESS   (Telegram Bot API)
#
# The config itself is generated by roles/xray/tasks/client_configs.yml from
# pass xray/uuids using the shared `x13` identity (full_proxy). Run
# ./publish-xray-client-configs.sh, then ./install-xray-client.sh (or this
# playbook directly).
- name: Deploy the Xray client on the home node
  hosts: xray_clients
  become: true

  roles:
    - role: xray_client
      tags: [xray_client]
