---
- name: Check mandatory variables are defined
  ansible.builtin.assert:
    that:
      - K3S_TOKEN is defined

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
    replace: '#\1\2\3swap\4'

- name: Check if UFW is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_binary

- name: Disable UFW
  community.general.ufw:
    state: disabled
  when: ufw_binary.stat.exists

- name: Gather facts about services
  ansible.builtin.service_facts:

- name: IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  tags: [k3s-node-name]

- name: Manage k3s config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s
  tags: [k3s-node-name]

# All runtime flags (token, node-external-ip, flannel backend, cidrs, tls-san, ...) live in
# /etc/rancher/k3s/config.yaml, which k3s reads on every start — so changing them later just
# means editing config.yaml.j2 and letting the restart handler apply it, instead of this
# install step (which only ever runs once) silently going stale.
- name: Install k3s
  args:
    executable: /usr/bin/bash
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version | quote }} INSTALL_K3S_EXEC=server sh -
  when: "'k3s' not in ansible_facts.services"
  changed_when: true

- name: Ensure k3s is in a running state
  ansible.builtin.service:
    name: k3s
    state: started

- name: Taint server node to prevent workload scheduling
  ansible.builtin.command:
    cmd: k3s kubectl taint node {{ inventory_hostname }} node-role.kubernetes.io/control-plane=:NoSchedule --overwrite
  changed_when: false

- name: Deploy Traefik HelmChartConfig
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "0644"

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/.kube/k3s-kubeconfig
    flat: true

- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: ~/.kube/k3s-kubeconfig
    mode: "0600"
  delegate_to: localhost
