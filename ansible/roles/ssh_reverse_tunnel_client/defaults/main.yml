---
# Public keys allowed to log in as this account directly — both the device's own key
# (for e.g. `ssh personal-fedora-ai@orb`) and each client device's tunnel-hop key
# routed through the jump host. Add a .pub file per key to ansible/files/devices/
# (shared with ssh_jump_user — see that role's comment) and list it here; removing an
# entry revokes that key on the next run (exclusive: true rewrites the whole
# authorized_keys file, same pattern as ssh_jump_user).
ssh_reverse_tunnel_client_authorized_keys:
  - "{{ lookup('file', playbook_dir + '/files/devices/mac.pub') }}"
  - "{{ lookup('file', playbook_dir + '/files/devices/phone.pub') }}"

# Must match this target's entry in ssh_reverse_tunnel_targets
# (ansible/roles/ssh_reverse_tunnel_user/defaults/main.yml) on the jump host.
# tunnel_clients.yml overrides both of these per host — every tunneled host needs its
# own port and its own tunnel-<name> account so a leaked key for one can never reach
# another.
ssh_reverse_tunnel_client_permitlisten: "127.0.0.1:2222"
ssh_reverse_tunnel_client_remote_user: tunnel-personal
ssh_reverse_tunnel_client_jump_host: nl1.morjoff.com

# Private half of the keypair whose public half is already registered as this target's
# public_key under ssh_reverse_tunnel_targets
# (ansible/roles/ssh_reverse_tunnel_user/files/) on the jump host. This role does NOT
# generate it — see ssh-jump.md step 1. Regenerating it here would produce a keypair
# the jump host doesn't recognize.
ssh_reverse_tunnel_client_identity_file: "{{ ansible_env.HOME }}/.ssh/reverse_tunnel"

# Debian/Ubuntu ship the sshd unit as ssh.service; Fedora/RHEL ship it as sshd.service.
ssh_reverse_tunnel_client_sshd_service: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"

# Group membership that trips a `required` pam_limits.so over an rtprio/nice limit
# (from the pipewire package's /etc/security/limits.d/25-pw-rlimits.conf) that this
# host can't actually satisfy, taking down every SSH login with
# "PAM: pam_open_session(): Permission denied" even after successful auth. Not needed
# on a headless dev VM.
ssh_reverse_tunnel_client_pipewire_group: pipewire
