---
- name: Check mandatory variables are defined
  ansible.builtin.assert:
    that:
      - GCLOUD_RW_API_KEY is defined
      - GCLOUD_FM_URL is defined
      - GCLOUD_FM_POLL_FREQUENCY is defined
      - GCLOUD_FM_HOSTED_ID is defined

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Grafana GPG key to keyring
  ansible.builtin.copy:
    src: gpg-full.key
    dest: "{{ grafana_repo_signed_by }}"
    mode: "0644"

- name: Add Grafana repository (mirror-aware)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ grafana_repo_signed_by }}]
      {{ grafana_repo_base_url }}
      {{ grafana_repo_distribution }}
      {{ grafana_repo_components }}
    filename: grafana
    state: present

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    update_cache: true

# Pod log directories (e.g. /var/log/pods) are owned root:root 0750, unreadable by the
# packaged alloy user. Grant just enough capability to bypass read/traverse permission
# checks rather than running the whole process as root.
- name: Grant pod log read access (bypasses DAC checks for reads only)
  community.general.capabilities:
    path: /usr/bin/alloy
    capability: cap_dac_read_search+ep
    state: present
  when: grafana_alloy_collect_pod_logs | default(false)
  notify: Restart Grafana Alloy

# The template file is created as follows:
# curl -sSL https://storage.googleapis.com/cloud-onboarding/alloy/config/config-fm.alloy | sed 's/\({[A-Z_]\+}\)/{\1}/g' > ansible/roles/grafana_alloy/templates/config.alloy
- name: Create Alloy config
  ansible.builtin.template:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: alloy
    group: alloy
    mode: "0640"
  vars:
    GCLOUD_FM_COLLECTOR_ID: "{{ inventory_hostname }}"
  notify: Restart Grafana Alloy

- name: Enable and start Grafana Alloy
  ansible.builtin.service:
    name: alloy
    state: started
    enabled: true

- name: Ensure drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: "0755"

- name: Write env.conf for alloy service
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/env.conf
    mode: "0644"
    content: |
      [Service]
      Environment="GCLOUD_RW_API_KEY={{ GCLOUD_RW_API_KEY }}"
  notify:
    - Daemon reload
    - Restart Grafana Alloy

# Alloy is a background monitoring agent running as a host service, so Kubernetes doesn't
# schedule or weight it alongside the workloads it observes. On a constrained node it should
# lose CPU contention rather than compete on equal footing. CPUWeight is the cgroup v2
# proportional lever (default 100; lower = smaller share, and only bites when the CPU is
# actually saturated); Nice is the classic priority hint alongside it.
#
# Note this is hygiene, not a fix for anything: it was tried against the Traefik crash-loop
# described in k3s.md and made no difference, because that turned out to be memory thrashing
# rather than CPU contention. Scheduling weight can't shrink a memory footprint.
- name: Write priority.conf for alloy service (lower CPU priority than k8s workloads)
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/priority.conf
    mode: "0644"
    content: |
      [Service]
      CPUWeight=20
      Nice=10
  notify:
    - Daemon reload
    - Restart Grafana Alloy
