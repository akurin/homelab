---
- name: Check mandatory variables are defined
  ansible.builtin.assert:
    that:
      - GCLOUD_RW_API_KEY is defined
      - GCLOUD_FM_URL is defined
      - GCLOUD_FM_POLL_FREQUENCY is defined
      - GCLOUD_FM_HOSTED_ID is defined

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Grafana GPG key to keyring
  ansible.builtin.copy:
    src: gpg-full.key
    dest: "{{ grafana_repo_signed_by }}"
    mode: "0644"

- name: Add Grafana repository (mirror-aware)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ grafana_repo_signed_by }}]
      {{ grafana_repo_base_url }}
      {{ grafana_repo_distribution }}
      {{ grafana_repo_components }}
    filename: grafana
    state: present

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    update_cache: true

# Pod log directories (e.g. /var/log/pods) are owned root:root 0750, unreadable by the
# packaged alloy user. Grant just enough capability to bypass read/traverse permission
# checks rather than running the whole process as root.
- name: Grant pod log read access (bypasses DAC checks for reads only)
  community.general.capabilities:
    path: /usr/bin/alloy
    capability: cap_dac_read_search+ep
    state: present
  when: grafana_alloy_collect_pod_logs | default(false)
  notify: Restart Grafana Alloy

# The template file is created as follows:
# curl -sSL https://storage.googleapis.com/cloud-onboarding/alloy/config/config-fm.alloy | sed 's/\({[A-Z_]\+}\)/{\1}/g' > ansible/roles/grafana_alloy/templates/config.alloy
- name: Create Alloy config
  ansible.builtin.template:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: alloy
    group: alloy
    mode: "0640"
  vars:
    GCLOUD_FM_COLLECTOR_ID: "{{ inventory_hostname }}"
  notify: Restart Grafana Alloy

- name: Ensure drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: "0755"

- name: Write env.conf for alloy service
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/env.conf
    mode: "0644"
    content: |
      [Service]
      Environment="GCLOUD_RW_API_KEY={{ GCLOUD_RW_API_KEY }}"
  notify:
    - Daemon reload
    - Restart Grafana Alloy

# Alloy is a background monitoring agent running as a host service, so Kubernetes doesn't
# schedule or weight it alongside the workloads it observes. On a constrained node it must
# lose CPU contention rather than compete on equal footing: SCHED_IDLE (CPUWeight=idle plus
# CPUSchedulingPolicy=idle) means it only runs when k3s has nothing to run.
#
# This was measured, not assumed (see k3s.md, "Memory and swap"). On one vCPU with a 60%
# competing load, Alloy at default priority drove readyz into a 3-second timeout wall (36
# Slow SQL lines); at idle priority the same config produced 0 timeouts and 0 Slow SQL, and
# Alloy caught up at 26% of the core once the load stopped. Latency under load is still
# worse than without Alloy (p95 543ms vs 134ms), so this makes the agent survivable, not free.
#
# Memory is capped hard, not softly: MemoryMax kills Alloy alone (systemd restarts it).
# There is no MemoryHigh — the old 250M soft limit pinned the cgroup exactly there and the
# kernel reclaim it caused is what stalled the API. With only MemoryMax=400M the cgroup
# settles at ~130M. GOMEMLIMIT keeps the Go heap under that without forcing GC at the limit.
- name: Write priority.conf for alloy service (idle CPU priority and a hard memory cap)
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/priority.conf
    mode: "0644"
    content: |
      [Service]
      CPUWeight=idle
      CPUSchedulingPolicy=idle
      Nice=19
      IOSchedulingClass=idle
      CPUQuota={{ grafana_alloy_cpu_quota }}
      MemoryMax={{ grafana_alloy_memory_max }}
      Environment="GOMEMLIMIT={{ grafana_alloy_gomemlimit }}"
  notify:
    - Daemon reload
    - Restart Grafana Alloy

# Started last, so the resource policy and env are already in place on the first start.
- name: Enable and start Grafana Alloy
  ansible.builtin.service:
    name: alloy
    state: "{{ 'started' if grafana_alloy_enabled | bool else 'stopped' }}"
    enabled: "{{ grafana_alloy_enabled | bool }}"
