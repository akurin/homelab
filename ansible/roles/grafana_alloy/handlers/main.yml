---
- name: Daemon reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Grafana Alloy
  ansible.builtin.service:
    name: alloy
    state: restarted
  # A stopped deployment must stay stopped: the role writes config and drop-ins even when
  # Alloy is disabled, and restarting would silently bring it back.
  when: grafana_alloy_enabled | bool
