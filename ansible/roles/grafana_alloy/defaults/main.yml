---
# Named mirror map; override or extend per environment
grafana_repo_mirrors:
  official: https://apt.grafana.com
  yandex: https://mirror.yandex.ru/mirrors/packages.grafana.com/oss/deb

# Select which mirror to use (key from grafana_repo_mirrors)
grafana_repo_mirror: official

# Base URL derived from selected mirror; falls back to official if key missing
grafana_repo_base_url: "{{ grafana_repo_mirrors[grafana_repo_mirror] | default(grafana_repo_mirrors['official']) }}"

grafana_repo_distribution: stable
grafana_repo_components: main
grafana_repo_signed_by: /etc/apt/keyrings/grafana.asc

# Also tail Kubernetes pod logs locally (Fleet Management doesn't manage this —
# containerd writes pod logs to files, not systemd's journal, so the host-log journal
# reader Fleet Management provides can't see them). No effect on non-Kubernetes hosts
# running this role. When enabled, pushes directly to grafana_alloy_loki_url below —
# independent of whatever destinations Fleet Management's own pipeline uses.
grafana_alloy_collect_pod_logs: false
grafana_alloy_loki_url: https://logs-prod3.grafana.net./loki/api/v1/push
grafana_alloy_loki_username: "205789"
grafana_alloy_pod_logs_path: /var/log/pods/**/*.log
# Glob of pod log files to skip; /var/log/pods/<namespace>_<pod>_<uid>/... Empty = none.
grafana_alloy_pod_logs_exclude_path: /var/log/pods/longhorn-system_*/**/*.log

# Pod log volume ceiling, so Alloy's work stays bounded however much the cluster logs.
# Lines over the limit are dropped and counted (loki_process_dropped_lines_total).
grafana_alloy_pod_logs_rate: 200
grafana_alloy_pod_logs_burst: 1000
# Lines older than this when read (e.g. backlog after a throttled period) are dropped.
grafana_alloy_pod_logs_max_age: 15m

# Hard resource limits for the whole Alloy process — they cover Fleet Management's
# pipelines too, since those run inside the same process.
grafana_alloy_cpu_quota: 25%
grafana_alloy_memory_high: 150M
grafana_alloy_memory_max: 250M
grafana_alloy_gomemlimit: 120MiB
