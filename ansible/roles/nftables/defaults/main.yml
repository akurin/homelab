---
nftables_allowed_tcp:
  - 22

nftables_allowed_udp: []

# Source+port scoped trust: [{ group: "k3s_agent", tcp: [6443], udp: [51820] }, ...]
# Trusts every current host in the named inventory group for just these ports — use this
# instead of nftables_trusted_sources when peers should only reach specific ports. Scales
# to any number of hosts in the group without further changes.
nftables_trusted_source_groups: []

nftables_full_flush: false
