---
- name: Check mandatory variables are defined
  ansible.builtin.assert:
    that:
      - item.public_keys | length > 0
      - item.public_keys | select('equalto', '') | list | length == 0
    fail_msg: "ssh_jump_targets entry '{{ item.name }}' has no public keys configured"
  loop: "{{ ssh_jump_targets }}"
  loop_control:
    label: "{{ item.name }}"

# No shell, no sudo — these accounts exist only to be sshd's authentication context for
# forward-restricted keys. Even a fully compromised key can't do anything beyond what
# the authorized_keys restrictions below allow.
- name: Create restricted jump users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
  loop: "{{ ssh_jump_targets }}"
  loop_control:
    label: "{{ item.name }}"

# command= overrides anything the client asks to run — no shell/command ever executes.
# permitopen= caps forwarding to just this target's reverse-tunnel listener on this
# same host; no-pty/no-agent-forwarding/no-X11-forwarding/no-user-rc close the rest of
# the usual SSH-key attack surface. exclusive=true rewrites the whole file from
# item.public_keys each run, so dropping a device from the list fully revokes it — a
# stolen phone can be cut off by deleting its .pub and re-running.
- name: Install restricted authorized_keys entries
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.public_keys | join('\n') }}"
    key_options: >-
      command="echo 'This key only allows local port forwarding to {{ item.name }}'",no-pty,no-agent-forwarding,no-X11-forwarding,no-user-rc,permitopen="127.0.0.1:{{ item.port }}"
    exclusive: true
    state: present
  loop: "{{ ssh_jump_targets }}"
  loop_control:
    label: "{{ item.name }}"
