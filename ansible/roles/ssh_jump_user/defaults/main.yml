---
ssh_jump_user_name: jump

# Must match ssh_reverse_tunnel_user_permitlisten — this is the only destination
# this account is ever allowed to forward a connection to.
ssh_jump_user_permitopen: "127.0.0.1:2222"

# Public keys of trusted client devices (phone, spare laptop, ...). Add a .pub file
# per device to ansible/files/devices/ (shared with ssh_reverse_tunnel_client — a
# device's key often needs to be trusted for both the jump hop and the home hop, and
# a single copy avoids the two drifting out of sync) and list it here; removing an
# entry revokes that device on the next run (exclusive: true rewrites the whole
# authorized_keys file).
ssh_jump_user_public_keys:
  - "{{ lookup('file', playbook_dir + '/files/devices/phone.pub') }}"
  - "{{ lookup('file', playbook_dir + '/files/devices/mac.pub') }}"
