---
# One reverse-tunnel-owning account per tunneled target, named tunnel-<name>.
# Only that target's own host ever authenticates as this account (see
# ssh_reverse_tunnel_client_remote_user in
# ansible/roles/ssh_reverse_tunnel_client/defaults/main.yml, which must
# match), and its permitlisten port must match the corresponding entry in
# ssh_jump_targets (ansible/roles/ssh_jump_user/defaults/main.yml).
#
# Each public_key is the public half of that target host's dedicated tunnel
# keypair. Generate it on the target host with
# `ssh-keygen -t ed25519 -f /etc/ssh/tunnel_key -N ""` and drop the resulting
# .pub in files/ here — see ssh-jump.md.
ssh_reverse_tunnel_targets:
  - name: personal
    port: 2222
    public_key: "{{ lookup('file', role_path + '/files/personal_reverse_tunnel.pub') }}"
  - name: work
    port: 2223
    public_key: "{{ lookup('file', role_path + '/files/work_reverse_tunnel.pub') }}"
