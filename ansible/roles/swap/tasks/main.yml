---
- name: Disable swap
  when: not swap_enabled
  block:
    - name: Turn off swap
      ansible.builtin.command: swapoff -a
      changed_when: true

    - name: Remove swapfile entry from /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        state: absent
        regexp: '.*swap.*'

    - name: Remove the swapfile
      ansible.builtin.file:
        path: "{{ swap_file }}"
        state: absent

- name: Enable swap
  when: swap_enabled
  block:
    - name: Check whether the swapfile already exists
      ansible.builtin.stat:
        path: "{{ swap_file }}"
      register: swap_file_stat

    # fallocate rather than dd: it reserves extents without writing out 2 GiB of zeroes,
    # which matters when the reason for adding swap is that the node is already saturated.
    - name: Allocate the swapfile
      ansible.builtin.command: "fallocate -l {{ swap_size }} {{ swap_file }}"
      when: not swap_file_stat.stat.exists
      changed_when: true

    - name: Restrict swapfile permissions
      ansible.builtin.file:
        path: "{{ swap_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format the swapfile
      ansible.builtin.command: "mkswap {{ swap_file }}"
      when: not swap_file_stat.stat.exists
      changed_when: true

    - name: Persist the swapfile in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ swap_file }} none swap sw 0 0"
        regexp: "^{{ swap_file | regex_escape }}\\s"
        state: present

    - name: Check which swap devices are already active
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_active
      changed_when: false

    - name: Activate the swapfile
      ansible.builtin.command: "swapon {{ swap_file }}"
      when: swap_file not in swap_active.stdout
      changed_when: true

    - name: Set swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ swap_swappiness }}"
        sysctl_set: true
        state: present
        reload: true
