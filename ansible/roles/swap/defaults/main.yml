---
# Swap is off by default; enable it per host where memory pressure costs more than paging
# does. Kubernetes tolerates it (kubelet runs with failSwapOn: false), so either choice is
# safe.
swap_enabled: false

swap_file: /swapfile
swap_size: 2G

# Left at the kernel default. Raising it (80-100) biases reclaim towards evicting cold
# anonymous pages instead of page cache, which is what a memory-starved node wants; 60 is
# the value measured to resolve thrashing on this cluster's worker, so it stays until
# something says otherwise.
swap_swappiness: 60
