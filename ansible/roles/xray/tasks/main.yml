---
- name: Parse users YAML
  ansible.builtin.set_fact:
    xray_users: "{{ xray_users_b64 | b64decode | from_json }}"

- name: Select xray_client user
  ansible.builtin.set_fact:
    xray_client_user: >-
      {{
        xray_users
        | selectattr('name', 'equalto', 'xray_client')
        | list
        | first
      }}

- name: Check installed Xray version
  ansible.builtin.command: /usr/local/bin/xray version
  register: xray_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Xray
  ansible.builtin.shell: bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install --version {{ xray_version }}
  args:
    executable: /bin/bash
  when: >-
    xray_installed_version.rc != 0
    or ('Xray ' ~ (xray_version | regex_replace('^v', '')) ~ ' ') not in xray_installed_version.stdout
  notify: Restart Xray

- name: Download runetfreedom geo data
  ansible.builtin.get_url:
    url: "{{ xray_geodata_base_url }}/{{ item }}"
    # Re-downloads only when the published checksum changes
    checksum: "sha256:{{ xray_geodata_base_url }}/{{ item }}.sha256sum"
    dest: "/usr/local/share/xray/{{ item }}"
    mode: "0644"
  loop:
    - geoip.dat
    - geosite.dat
  # geosite.dat is ~74 MB; fetch it only where routing rules reference geosite
  when: >-
    item != 'geosite.dat'
    or 'geosite:' in (
      (
        (xray_routing_rules | default([]))
        + (xray_additional_routing_rules | default([]))
      ) | to_json
    )
  notify: Restart Xray

- name: Prepare Xray outbounds
  ansible.builtin.include_tasks: outbounds.yml

- name: Register WARP device (idempotent)
  ansible.builtin.include_tasks: warp_register.yml
  when: xray_warp_enabled | bool

- name: Get Xray service group
  ansible.builtin.shell: |
    set -o pipefail
    user="$(systemctl show -p User --value xray)"
    id -gn "${user:-root}"
  args:
    executable: /bin/bash
  register: xray_service_group
  changed_when: false
  check_mode: false

- name: Save Xray config
  ansible.builtin.copy:
    dest: /usr/local/etc/xray/config.json
    owner: root
    group: "{{ xray_service_group.stdout }}"
    mode: "0640"
    content: "{{ lookup('template', 'server_config.j2') | from_json | to_nice_json }}"
    # Temp file has no .json extension, so the format must be explicit
    validate: /usr/local/bin/xray run -test -format json -c %s
  notify: Restart Xray

- name: Apply Xray changes before the next roles run
  ansible.builtin.meta: flush_handlers

- name: Ensure Xray service is enabled and running
  ansible.builtin.systemd:
    name: xray
    state: started
    enabled: true

- name: Generate client configs
  ansible.builtin.include_tasks: client_configs.yml
  tags: [client_configs]
