---
- name: Check Xray outbound list
  ansible.builtin.assert:
    that:
      - xray_outbounds is sequence
      - xray_outbounds is not string
      - xray_client is mapping
      - xray_client.dns_query_strategy | default('UseIP') in ['UseIP', 'UseIPv4', 'UseIPv6', 'UseSystem']
      - xray_client.target_strategy | default('AsIs') in ['AsIs', 'UseIP', 'UseIPv6v4', 'UseIPv6', 'UseIPv4v6', 'UseIPv4', 'ForceIP', 'ForceIPv6v4', 'ForceIPv6', 'ForceIPv4v6', 'ForceIPv4']
    fail_msg: "xray_outbounds or xray_client has an invalid shape on {{ inventory_hostname }}"
    quiet: true

- name: Check Xray outbound selections
  ansible.builtin.assert:
    that:
      - item.type | default('') in ['direct', 'block', 'warp', 'protonvpn', 'named']
      - item.type | default('') != 'protonvpn' or item.config | default('') | length > 0
      - item.type | default('') != 'named' or item.name | default('') | length > 0
    fail_msg: "Invalid Xray outbound selection: {{ item | to_json }}"
    quiet: true
  loop: "{{ xray_outbounds }}"
  loop_control:
    label: "{{ item.type | default('invalid') }}"

- name: Resolve Xray outbound selections
  ansible.builtin.set_fact:
    xray_warp_enabled: >-
      {{ xray_outbounds | selectattr('type', 'equalto', 'warp') | list | length > 0 }}
    xray_protonvpn_config_name: >-
      {{
        xray_outbounds
        | selectattr('type', 'equalto', 'protonvpn')
        | map(attribute='config')
        | first
        | default('')
      }}
    xray_named_outbound_names: >-
      {{
        xray_outbounds
        | selectattr('type', 'equalto', 'named')
        | map(attribute='name')
        | list
      }}

- name: Parse ProtonVPN configs JSON
  ansible.builtin.set_fact:
    protonvpn_configs: "{{ protonvpn_configs_b64 | b64decode | from_json }}"
  when: xray_protonvpn_config_name | length > 0
  no_log: true

- name: Check requested ProtonVPN config exists
  ansible.builtin.assert:
    that: xray_protonvpn_config_name in (protonvpn_configs | map(attribute='name') | list)
    fail_msg: "ProtonVPN config '{{ xray_protonvpn_config_name }}' was not found"
    quiet: true
  when: xray_protonvpn_config_name | length > 0

- name: Select ProtonVPN config
  ansible.builtin.set_fact:
    protonvpn_config: >-
      {{
        protonvpn_configs
        | selectattr('name', 'equalto', xray_protonvpn_config_name)
        | list
        | first
      }}
  when: xray_protonvpn_config_name | length > 0
  no_log: true

- name: Require named outbound configs when named outbounds are selected
  ansible.builtin.assert:
    that: xray_outbounds_b64 is defined
    fail_msg: >-
      A named outbound is selected, but xray_outbounds_b64 was not provided.
      Pass the base64-encoded contents of pass xray/outbounds.
    quiet: true
  when: xray_named_outbound_names | length > 0

- name: Parse named outbound configs JSON
  ansible.builtin.set_fact:
    xray_outbound_configs: "{{ xray_outbounds_b64 | b64decode | from_json }}"
  when: xray_named_outbound_names | length > 0
  no_log: true

- name: Check requested named outbound configs exist
  ansible.builtin.assert:
    that:
      - xray_named_outbound_names | unique | length == xray_named_outbound_names | length
      - xray_named_outbound_names | difference(xray_outbound_configs | map(attribute='name') | list) | length == 0
    fail_msg: >-
      Named outbound config is missing or selected more than once.
      Requested: {{ xray_named_outbound_names | join(', ') }}
    quiet: true
  when: xray_named_outbound_names | length > 0

- name: Initialize selected named outbounds
  ansible.builtin.set_fact:
    xray_selected_outbounds: []

- name: Select named outbound configs in inventory order
  ansible.builtin.set_fact:
    xray_selected_outbounds: >-
      {{
        xray_selected_outbounds
        + [
            (
              xray_outbound_configs
              | selectattr('name', 'equalto', item)
              | map(attribute='outbound')
              | first
            )
          ]
      }}
  loop: "{{ xray_named_outbound_names }}"
  no_log: true

- name: Check named outbound definitions
  ansible.builtin.assert:
    that:
      - xray_selected_outbounds | selectattr('tag', 'defined') | list | length == xray_selected_outbounds | length
      - xray_selected_outbounds | selectattr('protocol', 'defined') | list | length == xray_selected_outbounds | length
      - xray_selected_outbounds | map(attribute='tag') | unique | length == xray_selected_outbounds | length
      - xray_selected_outbounds | map(attribute='tag') | intersect(['next_proxy', 'warp', 'protonvpn', 'direct', 'block']) | length == 0
    fail_msg: >-
      Every named outbound must have a unique tag and protocol, and its tag
      must not use a built-in outbound tag.
    quiet: true
  when: xray_selected_outbounds | length > 0

- name: Initialize configured outbound tags
  ansible.builtin.set_fact:
    xray_configured_outbound_tags: []

- name: Preserve configured outbound order
  ansible.builtin.set_fact:
    xray_configured_outbound_tags: >-
      {{
        xray_configured_outbound_tags
        + [
            item.type
            if item.type in ['direct', 'block', 'warp']
            else 'protonvpn'
            if item.type == 'protonvpn'
            else (
              xray_outbound_configs
              | selectattr('name', 'equalto', item.name)
              | map(attribute='outbound')
              | map(attribute='tag')
              | first
            )
          ]
      }}
  loop: "{{ xray_outbounds }}"
  loop_control:
    label: "{{ item.type }}"
  no_log: true

- name: Check configured outbound tags are unique
  ansible.builtin.assert:
    that: >-
      xray_configured_outbound_tags | unique | length
      == xray_configured_outbound_tags | length
    fail_msg: "An Xray outbound type or tag is selected more than once"
    quiet: true

- name: Collect available outbound tags
  ansible.builtin.set_fact:
    xray_available_outbound_tags: >-
      {{
        ['direct', 'block']
        + (['next_proxy'] if (next_address | default('') | length > 0) else [])
        + xray_configured_outbound_tags
      }}

- name: Check routing rules reference configured outbounds
  ansible.builtin.assert:
    that: >-
      (
        (
          (xray_routing_rules | default([]))
          + (xray_additional_routing_rules | default([]))
        )
        | selectattr('outboundTag', 'defined')
        | map(attribute='outboundTag')
        | difference(xray_available_outbound_tags)
        | length
      ) == 0
    fail_msg: >-
      A routing rule on {{ inventory_hostname }} references an outbound that is
      not configured. Available: {{ xray_available_outbound_tags | unique | join(', ') }}
    quiet: true

- name: Resolve default outbound
  ansible.builtin.set_fact:
    xray_default_outbound: >-
      {{
        'next_proxy'
        if (next_address | default('') | length > 0)
        else (xray_configured_outbound_tags | first)
        if (xray_configured_outbound_tags | length > 0)
        else 'direct'
      }}

- name: Check default outbound is configured on this host
  ansible.builtin.assert:
    that: xray_default_outbound in xray_available_outbound_tags
    fail_msg: "Outbound '{{ xray_default_outbound }}' is not configured on {{ inventory_hostname }}"
    quiet: true
