xray:
  vars:
    ansible_user: root
    grafana_alloy_collector_attrs:
      reverse_proxy: caddy
    xray_xhttp_port_internal: 10000
    # Not a secret: VLESS authenticates by user UUID; the path only fronts Xray behind Caddy
    xray_xhttp_path: media/chunks

  hosts:
    ru-ruvds:
      ansible_host: 194.35.112.2
      grafana_repo_mirror: yandex
      domain: clumsypanda.mooo.com
      dns: freedns
      #      cdn_domain: 3v6ocwf108.cdn.twcstorage.ru
      #      server_ip: 151.236.89.224
      next_address: dk1.morjoff.com
      #      xray_xhttp_extra_settings: &xray_xhttp_extra_settings
      #        uplinkHTTPMethod: GET
      #        xPaddingObfsMode: true
      #        xPaddingPlacement: header
      #        xPaddingHeader: b3
      #        xPaddingMethod: tokenish
      #        sessionPlacement: query
      #        sessionKey: api_key
      #        seqPlacement: query
      next_address_xray_xhttp_extra_settings: &xray_xhttp_extra_settings
        mode: packet-up
        uplinkHTTPMethod: GET
        xPaddingObfsMode: true
        xPaddingPlacement: header
        xPaddingHeader: x-b3-traceid
        xPaddingMethod: tokenish
        sessionIDPlacement: path
        sessionIDTable: Base62
        sessionIDLength: 15
        seqPlacement: header
        seqKey: x-b3-spanid
      warp_outbound_enabled: false
      xray_routing_rules:
        # Russian sites by domain (no DNS lookup needed)
        - type: field
          domain: [ "domain:ru", "domain:xn--p1ai", "domain:su", "geosite:ru-available-only-inside" ]
          outboundTag: direct
        # Anything else that resolves to a Russian IP
        - type: field
          ip: [ "geoip:ru" ]
          outboundTag: direct

    dk-webdock:
      ansible_host: 92.113.145.63
      domain: dk1.morjoff.com
      dns: external
      cdn_domain: c0gziaho6h.cdn.twcstorage.ru
      server_ip: 151.236.89.224
      xray_xhttp_extra_settings: *xray_xhttp_extra_settings
      warp_outbound_enabled: false
      protonvpn_config_name: "NL-FREE#103"

    nl-vdsina:
      ansible_host: 89.124.104.67
      domain: nl1.morjoff.com
      dns: external
      warp_outbound_enabled: true

  children:
    xray_publish:
      hosts:
        ru-ruvds:

    ssh_jump:
      hosts:
        nl-vdsina:

    # Exit nodes: OpenAI, Anthropic and AWS console/API domains are routed to
    # `direct` (this server's own IP) instead of the default ProtonVPN/WARP exit.
    xray_exit:
      hosts:
        dk-webdock:
        nl-vdsina:
      vars:
        xray_routing_rules:
          - type: field
            domain:
              - "domain:openai.com"
              - "domain:chatgpt.com"
              - "domain:chat.com"
              - "domain:sora.com"
              - "domain:oaistatic.com"
              - "domain:oaiusercontent.com"
              - "domain:anthropic.com"
              - "domain:claude.ai"
              - "domain:claude.com"
              - "domain:claudeusercontent.com"
              # AWS Management Console, APIs, SSO and static assets
              - "domain:aws.amazon.com"
              - "domain:amazonaws.com"
              - "domain:awsstatic.com"
              - "domain:awsapps.com"
              - "domain:amazoncognito.com"
              # Google core services (geosite:google below adds the long tail
              # and country TLDs)
              - "domain:google.com"
              - "domain:googleapis.com"
              - "domain:gstatic.com"
              - "domain:googlevideo.com"
              - "domain:googleusercontent.com"
              - "domain:youtube.com"
              - "domain:gmail.com"
              - "geosite:google"
            outboundTag: direct
          # Google Meet/WebRTC media connects by IP without SNI, so a domain
          # rule never sees it; geoip:google keeps it off the VPN exit too.
          - type: field
            ip:
              - "geoip:google"
            outboundTag: direct
